---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 300MiB
    minimumSize:     100MiB
    label:           "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

# Pre-select "Install alongside" so a dual-boot with the existing Windows
# (or Linux) install is the default path. The welcome module's
# requiredStorage (@INSTALL_REQ_GIB@ GiB) sets the floor for the new
# system on the alongside splitter, so CFL Forensics can never be given
# less than ~@INSTALL_MIN_GIB@ GiB.
initialPartitioningChoice: alongside
initialSwapChoice: none
