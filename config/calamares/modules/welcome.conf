---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # @INSTALL_REQ_GIB@ GiB here makes the partition module reserve
    # @INSTALL_REQ_GIB@ + ~2 ≈ @INSTALL_MIN_GIB@ GiB for CFL Forensics when
    # installing alongside an existing OS, and requires any erase/replace
    # target to offer at least that much.
    requiredStorage:    @INSTALL_REQ_GIB@
    requiredRam:        2.0
    internetCheckUrl:   http://NetworkManager.org/check_network_status.txt
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
