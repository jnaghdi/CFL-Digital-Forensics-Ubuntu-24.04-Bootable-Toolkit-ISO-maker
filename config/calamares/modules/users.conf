---
defaultGroups:
    - adm
    - cdrom
    - sudo
    - dip
    - plugdev
    - lpadmin
    - lxd
    - sambashare
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false
availableShells: /bin/bash, /usr/bin/zsh

passwordRequirements:
    nonempty:  true
    minLength: 6

# hostname for the installed system
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "@LIVE_HOSTNAME@"
    forbiddenNames: [ localhost ]
