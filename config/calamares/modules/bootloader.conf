---
# GRUB for both BIOS and UEFI. On UEFI the installed system uses the
# Ubuntu-signed grubx64.efi whose built-in prefix is /EFI/ubuntu, so the
# bootloader-id MUST be "ubuntu" for Secure Boot to keep working.
efiBootLoader: "grub"
efiBootloaderId: "ubuntu"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# We copy shim+grub to EFI/BOOT/bootx64.efi ourselves in the finish
# shellprocess only when the firmware has no other bootloader, so leave
# Calamares' own fallback off (it would copy grubx64 unsigned as bootx64).
installEFIFallback: false
