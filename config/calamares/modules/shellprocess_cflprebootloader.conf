---
dontChroot: false
timeout: 60
script:
    # Calamares' unpackfs copies the squashfs, but the live kernel/initrd live
    # on the ISO under /casper, not inside the squashfs. Make sure the target
    # has a kernel + initrd image present before grub-install / update-grub run.
    - command: |
        set -e
        KVER=$(ls /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -1)
        if [ -z "$KVER" ]; then
            SRC=$(ls /cdrom/casper/vmlinuz 2>/dev/null | head -1)
            if [ -n "$SRC" ]; then
                KPKG=$(dpkg-query -W -f='${Package}\n' 'linux-image-*' 2>/dev/null | grep -v -- -dbg | sort -V | tail -1)
                KVER=${KPKG#linux-image-}
                cp /cdrom/casper/vmlinuz "/boot/vmlinuz-${KVER:-generic}"
            fi
        fi
        [ -n "$KVER" ] && [ ! -e "/boot/initrd.img-$KVER" ] && update-initramfs -c -k "$KVER" || true
        exit 0
      timeout: 60
