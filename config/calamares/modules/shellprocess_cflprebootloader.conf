---
# Runs inside the new system. The logic lives in a real script shipped in the
# image: Calamares expands dollar-brace variables in these commands itself and refuses any
# variable it does not know, so no shell variables may appear here.
dontChroot: false
timeout: 120
script:
    - command: /usr/local/sbin/cfl-install-prebootloader
      timeout: 120
