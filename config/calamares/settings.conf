# CFL Forensics - Calamares installer configuration (YAML 1.2)
# Target: Calamares 3.3.5 (Ubuntu 24.04 'noble' package).
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
# two shellprocess instances: one just before, one just after the bootloader
- id:     cflprebootloader
  module: shellprocess
  config: shellprocess_cflprebootloader.conf
- id:     cflfinish
  module: shellprocess
  config: shellprocess_cflfinish.conf

sequence:
# ---- phase 1: ask the user ----
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
# ---- phase 2: install ----
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@cflprebootloader
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - shellprocess@cflfinish
  - umount
# ---- phase 3: done ----
- show:
  - finished

branding: cfl
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
