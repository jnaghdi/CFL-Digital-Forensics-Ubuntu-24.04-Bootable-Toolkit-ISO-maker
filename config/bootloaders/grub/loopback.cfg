# CFL Forensics @CFL_VERSION@ - loopback entry.
# Sourced when the ISO is booted via `loopback loop file.iso` from another
# GRUB (Ventoy, grml-rescueboot, a multiboot USB). findiso= lets casper
# locate the .iso inside the host partition.

if [ -z "${iso_path}" ]; then
    echo "loopback.cfg: iso_path is not set by the host GRUB"
fi

set cfl_common="boot=casper noprompt hostname=@LIVE_HOSTNAME@ locale=@LIVE_LOCALE@ keyboard-configuration/layoutcode=@LIVE_KEYMAP@ nopersistent"

menuentry "CFL Forensics @CFL_VERSION@ - Live (forensic mode)" {
    linux  /casper/vmlinuz ${cfl_common} findiso=${iso_path} quiet cfl-forensic-mode ---
    initrd /casper/initrd
}

menuentry "CFL Forensics @CFL_VERSION@ - Live (load entirely to RAM)" {
    linux  /casper/vmlinuz ${cfl_common} findiso=${iso_path} toram quiet cfl-forensic-mode ---
    initrd /casper/initrd
}

menuentry "Install CFL Forensics (alongside Windows / dual-boot)" {
    linux  /casper/vmlinuz ${cfl_common} findiso=${iso_path} quiet cfl-install ---
    initrd /casper/initrd
}
