# CFL Forensics @CFL_VERSION@ - ISO boot menu (BIOS + UEFI)
# Loaded by the El Torito core image (BIOS) and by EFI/boot/grubx64.efi (UEFI).

if [ -z "${prefix}" ]; then set prefix=/boot/grub; fi
if loadfont $prefix/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
fi

set theme=$prefix/themes/cfl/theme.txt
loadfont $prefix/themes/cfl/unicode.pf2
export theme

set default=0
set timeout=10
set timeout_style=menu

# Kernel command line shared by every live entry.
#  boot=casper                       hand control to casper's live scripts
#  quiet                             quiet boot, no graphical logo splash
#  noprompt                          do not wait for the medium to be removed
#  hostname/locale/keymap            preseed the live identity (see casper.conf)
#  ---                               separate live args from the installed cmdline
set cfl_common="boot=casper noprompt hostname=@LIVE_HOSTNAME@ locale=@LIVE_LOCALE@ keyboard-configuration/layoutcode=@LIVE_KEYMAP@ nopersistent"
set cfl_quiet="quiet"
set cfl_verbose="nosplash"

menuentry "CFL Forensics @CFL_VERSION@ - Live (forensic mode)" --hotkey=l {
    echo "Loading CFL Forensics ${cfl_common} ..."
    linux  /casper/vmlinuz ${cfl_common} ${cfl_quiet} cfl-forensic-mode ---
    initrd /casper/initrd
}

menuentry "CFL Forensics @CFL_VERSION@ - Live (write-blocking ON at boot)" --hotkey=w {
    echo "Loading with software write-blocking enabled ..."
    linux  /casper/vmlinuz ${cfl_common} ${cfl_quiet} cfl-forensic-mode=on ---
    initrd /casper/initrd
}

menuentry "CFL Forensics @CFL_VERSION@ - Live (load entirely to RAM)" --hotkey=r {
    echo "Copying the system to RAM (you may remove the medium once running) ..."
    linux  /casper/vmlinuz ${cfl_common} ${cfl_quiet} toram cfl-forensic-mode ---
    initrd /casper/initrd
}

menuentry "CFL Forensics @CFL_VERSION@ - Live (safe graphics / nomodeset)" --hotkey=s {
    echo "Loading in safe-graphics mode ..."
    linux  /casper/vmlinuz ${cfl_common} ${cfl_verbose} nomodeset cfl-forensic-mode ---
    initrd /casper/initrd
}

menuentry "Install CFL Forensics (alongside Windows / dual-boot)" --hotkey=i {
    echo "Starting the CFL Forensics installer ..."
    linux  /casper/vmlinuz ${cfl_common} ${cfl_quiet} cfl-install ---
    initrd /casper/initrd
}

submenu "Utilities  (memory test, firmware setup) ..." --hotkey=u {
    set theme=$prefix/themes/cfl/theme.txt
    export theme

    menuentry "Check the boot medium for defects (md5)" --hotkey=v {
        linux  /casper/vmlinuz boot=casper integrity-check noprompt ---
        initrd /casper/initrd
    }

    if [ "${grub_platform}" = "efi" ]; then
        menuentry "Memory test (memtest86+, UEFI)" {
            if [ -f /boot/memtest86+x64.efi ]; then
                chainloader /boot/memtest86+x64.efi
            else
                echo "memtest86+ EFI binary not present on this image"; sleep 3
            fi
        }
        menuentry "UEFI firmware settings" --hotkey=f {
            fwsetup
        }
    else
        menuentry "Memory test (memtest86+)" {
            if [ -f /boot/memtest86+x64.bin ]; then
                linux16 /boot/memtest86+x64.bin
            else
                echo "memtest86+ BIOS binary not present on this image"; sleep 3
            fi
        }
    fi

    menuentry "Boot from the next volume / first hard disk" --hotkey=h {
        if [ "${grub_platform}" = "efi" ]; then
            exit
        else
            set root=(hd1)
            chainloader +1
        fi
    }
}

menuentry "Power off" --hotkey=p {
    halt
}
