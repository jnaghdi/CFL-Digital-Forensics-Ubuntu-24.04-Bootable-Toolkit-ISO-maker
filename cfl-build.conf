# CFL Forensics - build configuration (sourced by build.sh)
#
# Every setting uses the ": ${VAR:=value}" form, so an environment variable
# of the same name takes precedence:   sudo CFL_VERSION=2.1 ./build.sh
# Paths are relative to the project directory unless absolute.

# ---- identity -----------------------------------------------------------
: "${CFL_NAME:=CFL Forensics}"
: "${CFL_VERSION:=2.0.2}"
: "${CFL_CODENAME:=Noble}"                 # informational (Ubuntu 24.04 "Noble Numbat")
: "${CFL_URL:=https://cflab.uk/}"
: "${CFL_PUBLISHER:=Computer Forensics Lab Ltd - cflab.uk / e-discovery.uk}"

# ---- Ubuntu base --------------------------------------------------------
: "${UBUNTU_SUITE:=noble}"                 # 24.04 LTS
: "${UBUNTU_VERSION:=24.04}"
: "${ARCH:=amd64}"
: "${MIRROR:=http://archive.ubuntu.com/ubuntu/}"
: "${SECURITY_MIRROR:=http://security.ubuntu.com/ubuntu/}"
: "${ENABLE_BACKPORTS:=0}"                 # 1 = also enable noble-backports (not used by default)
: "${KERNEL_PKG:=linux-generic-hwe-24.04}" # HWE kernel = best hardware/boot support on modern machines.
#                                            # NOTE: the HWE kernel rolls forward and can be newer than the
#                                            # DKMS modules in the Ubuntu archive (e.g. lime-forensics 1.9.1).
#                                            # If LiME must be pre-built into the image, use the GA kernel:
#                                            #   KERNEL_PKG=linux-generic   (Ubuntu 24.04 GA series; LiME builds cleanly)
#                                            # A DKMS module that will not compile is never fatal - the build
#                                            # continues and records the outcome in DKMS-STATUS.txt.
: "${MOZILLA_APT:=1}"                      # 1 = Firefox as a .deb from packages.mozilla.org (Ubuntu's own firefox is a snap)

# ---- live session -------------------------------------------------------
: "${LIVE_USER:=cfl}"
: "${LIVE_USER_FULLNAME:=CFL Forensic Examiner}"
: "${LIVE_HOSTNAME:=cfl-forensics}"
: "${LIVE_LOCALE:=en_GB.UTF-8}"
: "${EXTRA_LOCALES:=en_US.UTF-8}"          # space separated, generated in addition to LIVE_LOCALE
: "${LIVE_KEYMAP:=gb}"
: "${LIVE_TIMEZONE:=Etc/UTC}"              # forensic default: the workstation clock stays on UTC
: "${WAYLAND:=0}"                          # 0 = GNOME on Xorg (root GUI tools behave best), 1 = Wayland default

# ---- installer ----------------------------------------------------------
: "${INSTALL_MIN_GIB:=128}"                # space reserved for CFL Forensics when installing alongside Windows
: "${INSTALL_TZ_REGION:=Europe}"           # pre-selected time zone in the installer
: "${INSTALL_TZ_ZONE:=London}"

# ---- image --------------------------------------------------------------
: "${ISO_VOLID:=CFLFORENSICS}"             # ISO9660 volume label (max 32 chars)
: "${ISO_NAME:=cfl-forensics-${CFL_VERSION}-${UBUNTU_SUITE}-${ARCH}.iso}"
: "${SQUASH_COMP:=zstd}"                   # zstd (fast boot, needs squashfs-tools >= 4.4) or xz (smallest)
: "${SQUASH_LEVEL:=19}"                    # zstd compression level (1-22); ignored for xz

# ---- directories --------------------------------------------------------
: "${WORK_DIR:=work}"                      # chroot + scratch (30 GB free recommended)
: "${OUT_DIR:=iso}"                        # finished ISO + checksums
: "${CACHE_DIR:=cache}"                    # downloaded .deb files, reused between builds

# ---- behaviour ----------------------------------------------------------
: "${HOOK_STRICT:=0}"                      # 1 = a failing hook aborts the build (default: warn and continue)
: "${PACKAGE_STRICT:=0}"                   # 1 = any uninstallable package aborts (default: skip with a warning)
: "${PARALLEL:=$(nproc 2>/dev/null || echo 2)}"
